[project]
name = "sparrow-data-pipeline"
version = "0.1.0"
description = "Data collection pipeline for sparrow monitoring images"
readme = "README.md"
requires-python = ">=3.11,<3.13"


dependencies = [
    "requests>=2.32.0",
]

[project.scripts]
sparrow-fetch = "sparrow_loader.cli:main"
sparrow-dedupe = "sparrow_loader.dedupe_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sparrow_loader"]